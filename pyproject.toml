[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urlcheck"
version = "1.1.0"
description = "Spot phishing signs in a URL without opening it: look-alike domains, hidden characters, wrapped links (SafeLinks, Proofpoint), JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["phishing", "url-analysis", "homograph", "blue-team"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/urlcheck"

[project.scripts]
urlcheck = "urlcheck:main"

[tool.setuptools]
py-modules = ["urlcheck"]
